<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Box</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --card-border: #26262a;
      --card-border-hover: #3f3f46;
      --accent: #ffffff;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: #ef4444;
      --error-text: #f87171;
      --success-bg: rgba(34, 197, 94, 0.12);
      --success-border: #22c55e;
      --success-text: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    /* Big Drop Zone Box */
    .dropzone {
      position: relative;
      background: var(--card-bg);
      border: 2px dashed var(--card-border);
      border-radius: 20px;
      padding: 72px 36px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 360px;
      user-select: none;
      overflow: hidden;
    }

    .dropzone:hover {
      border-color: var(--card-border-hover);
      background: #16161a;
    }

    .dropzone.dragover {
      border-color: #ffffff;
      background: #18181d;
      transform: scale(1.015);
    }

    /* Error Shake Animation */
    .dropzone.error {
      border-color: var(--error-border);
      background: var(--error-bg);
      animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Success Pop Animation */
    .dropzone.success {
      border-color: var(--success-border);
      background: var(--success-bg);
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    @keyframes pop {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* Icons and Content */
    .icon-wrapper {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #1c1c22;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      transition: all 0.3s ease;
    }

    .dropzone.error .icon-wrapper {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error-text);
    }

    .dropzone.success .icon-wrapper {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success-text);
      transform: scale(1.1);
    }

    .icon-svg {
      width: 38px;
      height: 38px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Checkmark Draw Animation */
    .checkmark-path {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      transition: stroke-dashoffset 0.4s ease 0.1s;
    }

    .dropzone.success .checkmark-path {
      stroke-dashoffset: 0;
    }

    .status-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
    }

    .status-desc {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 360px;
      line-height: 1.45;
      transition: color 0.2s ease;
    }

    .dropzone.error .status-title {
      color: var(--error-text);
    }

    .dropzone.error .status-desc {
      color: var(--error-text);
      opacity: 0.95;
    }

    .dropzone.success .status-title {
      color: var(--success-text);
    }

    .dropzone.success .status-desc {
      color: var(--success-text);
      opacity: 0.95;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Big Upload Box -->
    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="*">
      
      <div class="icon-wrapper" id="iconWrapper">
        <!-- Default Upload Icon -->
        <svg class="icon-svg" id="defaultIcon" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>

        <!-- Error Warning Icon -->
        <svg class="icon-svg" id="errorIcon" viewBox="0 0 24 24" style="display: none;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>

        <!-- Success Checkmark Icon -->
        <svg class="icon-svg" id="successIcon" viewBox="0 0 24 24" style="display: none;">
          <path class="checkmark-path" d="M20 6L9 17l-5-5"></path>
        </svg>
      </div>

      <div class="status-title" id="statusTitle">Upload Image</div>
      <div class="status-desc" id="statusDesc">Drag and drop your file here, or browse</div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const defaultIcon = document.getElementById('defaultIcon');
    const errorIcon = document.getElementById('errorIcon');
    const successIcon = document.getElementById('successIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');

    let resetTimer = null;

    // Drag & Drop event listeners
    ['dragenter', 'dragover'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (fileInput.files.length > 0) {
        handleFile(fileInput.files[0]);
      }
    });

    function handleFile(file) {
      const fileName = file.name.toLowerCase();
      const isJpeg = fileName.endsWith('.jpg') || fileName.endsWith('.jpeg') || file.type === 'image/jpeg';
      
      if (isJpeg) {
        showSuccess(file.name);
      } else {
        showError();
      }
    }

    function showError() {
      clearTimeout(resetTimer);
      dropzone.className = 'dropzone error';
      defaultIcon.style.display = 'none';
      successIcon.style.display = 'none';
      errorIcon.style.display = 'block';

      statusTitle.textContent = 'Only supports JPEG';
      statusDesc.textContent = 'PNG and other formats are not supported.';

      resetTimer = setTimeout(() => {
        resetState();
      }, 4000);
    }

    function showSuccess(fileName = 'image.jpg') {
      clearTimeout(resetTimer);
      dropzone.className = 'dropzone success';
      defaultIcon.style.display = 'none';
      errorIcon.style.display = 'none';
      successIcon.style.display = 'block';

      statusTitle.textContent = 'Uploaded Successfully';
      statusDesc.textContent = `${fileName}`;

      resetTimer = setTimeout(() => {
        resetState();
      }, 4000);
    }

    function resetState() {
      clearTimeout(resetTimer);
      dropzone.className = 'dropzone';
      defaultIcon.style.display = 'block';
      errorIcon.style.display = 'none';
      successIcon.style.display = 'none';
      statusTitle.textContent = 'Upload Image';
      statusDesc.textContent = 'Drag and drop your file here, or browse';
      fileInput.value = '';
    }
  </script>
</body>
</html>
